server {
    # Puerto en el que Nginx escuchará las solicitudes HTTP.
    # Render espera que el servicio web escuche en el puerto 10000.
    listen 10000;

    # Nombre del servidor. "_" se utiliza como nombre genérico para aceptar 
    # solicitudes que no coincidan con un nombre de servidor específico.
    server_name _;

    # Directorio raíz desde el que Nginx servirá la aplicación.
    # En Laravel, el punto de entrada público es la carpeta public.
    # No se debe exponer directamente el resto del proyecto.
    root /var/www/public;

    # Archivos que Nginx buscará como punto de entrada
    # cuando una solicitud se dirija a un directorio.
    index index.php index.html;

    # Gestionar las solicitudes HTTP que llegan al servidor.
    location / {
        # Comprueba si la ruta solicitada corresponde a un archivo existente ($uri)
        # o a un directorio existente ($uri/).
        # Si ninguno existe, redirige internamente la solicitud a index.php,
        # conservando los parámetros de la consulta.
        # Laravel se encargará de procesar la ruta solicitada.
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Identificar las solicitudes dirigidas a archivos PHP.
    location ~ \.php$ {
        # Enviar la solicitud PHP a PHP-FPM.
        # PHP-FPM está escuchando en el puerto 9000
        # de la misma máquina/contenedor.
        fastcgi_pass 127.0.0.1:9000;

        # Definir el archivo PHP que se utilizará como índice
        # en el procesamiento mediante FastCGI.
        fastcgi_index index.php;

        # Incorporar los parámetros FastCGI estándar
        # que Nginx necesita para comunicarse con PHP-FPM.
        include fastcgi_params;

        # Indicar la ruta absoluta del archivo PHP que PHP-FPMdebe procesar
        # combinando el directorio raíz y el nombre del archivo solicitado.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Bloquear las solicitudes dirigidas a archivos
    # cuya ruta comienza con .ht, como los archivos .htaccess.
    # Evita que estos archivos sean accesibles desde HTTP
    location ~ /\.ht {
        deny all;
    }
}